name: Daily AI News Pipeline

on:
  schedule:
    - cron: "30 1 * * *"   # 7:00 AM IST (01:30 UTC) every day
  workflow_dispatch:         # allows manual trigger from GitHub UI

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: "587"
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      DIGEST_EMAIL_TO: ${{ secrets.DIGEST_EMAIL_TO }}
      PIPELINE_HOURS: "24"
      TOP_N_DIGEST: "10"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify required secrets
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "❌ ERROR: DATABASE_URL secret is not set in GitHub Secrets!"
            echo "Go to: Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi
          # Print host only (safe — no password exposed)
          echo "✅ DATABASE_URL is set. Host: $(echo $DATABASE_URL | sed 's/.*@//' | cut -d'/' -f1)"

          if [ -z "$GEMINI_API_KEY" ]; then
            echo "❌ ERROR: GEMINI_API_KEY secret is not set!"
            exit 1
          fi
          echo "✅ All required secrets are present."

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --no-dev

      - name: Create database tables
        run: uv run python app/databases/create_table.py

      - name: Run daily pipeline
        run: uv run python -m app.daily_runner
